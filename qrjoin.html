<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Smart Club ENSEM — Connect with us on Instagram, WhatsApp, LinkedIn and TikTok."
    >

    <meta
        name="theme-color"
        content="#17191c"
    >

    <title>Connect | Smart Club ENSEM</title>


    <!-- =================================================
         FAVICON
         ================================================= -->

    <link
        rel="icon"
        type="image/jpeg"
        href="/logo.jpeg"
    >


    <!-- =================================================
         FONT AWESOME — SOCIAL MEDIA ICONS
         ================================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =================================================
         QR JOIN CSS
         ================================================= -->

    <link
        rel="stylesheet"
        href="qrjoin.css"
    >

</head>


<body>

    <main class="connect-page">


        <!-- =================================================
             SMART CLUB LOGO
             ================================================= -->

        <div class="connect-logo">

            <img
                src="logo.jpeg"
                alt="Smart Club ENSEM Logo"
            >

        </div>


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="connect-header">

            <h1>
                SMART CLUB
            </h1>

            <p>
                Digital Minds, Real Impact.
            </p>

            <span>
                CONNECT WITH US
            </span>

        </header>


        <!-- =================================================
             SOCIAL LINKS
             ================================================= -->

        <div class="social-links">


            <!-- =================================================
                 INSTAGRAM
                 ================================================= -->

            <a
                href="YOUR_INSTAGRAM_LINK"
                class="social-btn instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visit Smart Club on Instagram"
            >

                <span class="social-icon">

                    <i class="fa-brands fa-instagram"></i>

                </span>


                <span class="social-name">
                    Instagram
                </span>


                <span class="social-arrow">
                    ↗
                </span>

            </a>


            <!-- =================================================
                 WHATSAPP
                 ================================================= -->

            <a
                href="YOUR_WHATSAPP_LINK"
                class="social-btn whatsapp"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Contact Smart Club on WhatsApp"
            >

                <span class="social-icon">

                    <i class="fa-brands fa-whatsapp"></i>

                </span>


                <span class="social-name">
                    WhatsApp
                </span>


                <span class="social-arrow">
                    ↗
                </span>

            </a>


            <!-- =================================================
                 LINKEDIN
                 ================================================= -->

            <a
                href="YOUR_LINKEDIN_LINK"
                class="social-btn linkedin"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visit Smart Club on LinkedIn"
            >

                <span class="social-icon">

                    <i class="fa-brands fa-linkedin-in"></i>

                </span>


                <span class="social-name">
                    LinkedIn
                </span>


                <span class="social-arrow">
                    ↗
                </span>

            </a>


            <!-- =================================================
                 TIKTOK
                 ================================================= -->

            <a
                href="YOUR_TIKTOK_LINK"
                class="social-btn tiktok"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visit Smart Club on TikTok"
            >

                <span class="social-icon">

                    <i class="fa-brands fa-tiktok"></i>

                </span>


                <span class="social-name">
                    TikTok
                </span>


                <span class="social-arrow">
                    ↗
                </span>

            </a>


        </div>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer class="connect-footer">

            <span>
                SMART CLUB
            </span>

            <span>
                •
            </span>

            <span>
                ENSEM
            </span>

        </footer>


    </main>


    <!-- =================================================
         JAVASCRIPT
         ================================================= -->

    <script src="qrjoin.js"></script>

</body>

</html>
