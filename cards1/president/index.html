<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Club — President
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================================
     MAIN CINEMATIC SCENE
========================================================= -->

<main
    class="scene"
    id="scene"
>


    <!-- =====================================================
         BACKGROUND ENVIRONMENT
    ====================================================== -->

    <div class="scene-light scene-light-left"></div>

    <div class="scene-light scene-light-right"></div>

    <div class="scene-light scene-light-center"></div>


    <div class="background-grid"></div>


    <div
        class="particles"
        id="particles"
    ></div>


    <!-- distant circular structures -->

    <div class="background-energy-ring ring-one"></div>

    <div class="background-energy-ring ring-two"></div>


    <!-- additional very subtle halo -->

    <div class="scene-orbit scene-orbit-large"></div>

    <div class="scene-orbit scene-orbit-small"></div>




    <!-- =====================================================
         CARD STAGE
    ====================================================== -->

    <div class="card-stage">


        <!-- Ground light -->

        <div class="card-shadow"></div>


        <!-- Atmospheric glow -->

        <div class="stage-aura"></div>



        <!-- =================================================
             CARD WRAPPER
        ================================================== -->

        <div
            class="card-wrapper"
            id="card"
        >


            <!-- =================================================
                 CARD BACK
            ================================================== -->

            <article class="card-side card-back">


                <!-- =============================================
                     BACK BODY
                ============================================== -->

                <div class="back-shell"></div>

                <div class="back-metal-frame"></div>

                <div class="back-inner-frame"></div>

                <div class="back-hologram"></div>



                <!-- =============================================
                     BACK CHROME STRUCTURE
                ============================================== -->

                <div class="back-top-plate"></div>

                <div class="back-bottom-plate"></div>


                <div class="back-side-plate back-side-left"></div>

                <div class="back-side-plate back-side-right"></div>



                <!-- =============================================
                     CIRCUIT CORNERS
                ============================================== -->

                <div class="circuit circuit-top-left"></div>

                <div class="circuit circuit-top-right"></div>

                <div class="circuit circuit-bottom-left"></div>

                <div class="circuit circuit-bottom-right"></div>



                <!-- =============================================
                     ENERGY CORNERS
                ============================================== -->

                <div class="energy-corner back-corner-1"></div>

                <div class="energy-corner back-corner-2"></div>

                <div class="energy-corner back-corner-3"></div>

                <div class="energy-corner back-corner-4"></div>



                <!-- =================================================
                     SMART CLUB CORE
                ================================================== -->

                <div class="back-core">


                    <!-- orbit architecture -->

                    <div class="core-orbit orbit-large">

                        <span class="orbit-marker marker-a"></span>

                        <span class="orbit-marker marker-b"></span>

                    </div>


                    <div class="core-orbit orbit-medium">

                        <span class="orbit-marker marker-c"></span>

                    </div>


                    <div class="core-orbit orbit-small"></div>



                    <!-- =============================================
                         CUSTOM SMART BRAIN EMBLEM
                         NO EMOJI
                    ============================================== -->

                    <div class="brain-emblem">


                        <div class="brain-emblem-ring"></div>


                        <svg
                            class="brain-icon"
                            viewBox="0 0 120 120"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >


                            <!-- LEFT BRAIN -->

                            <path
                                class="brain-path brain-left"
                                d="
                                    M55 24
                                    C44 15 29 20 27 33
                                    C17 36 15 50 22 57
                                    C15 68 21 80 31 82
                                    C31 96 44 103 55 95
                                    Z
                                "
                            />


                            <!-- RIGHT BRAIN -->

                            <path
                                class="brain-path brain-right"
                                d="
                                    M65 24
                                    C76 15 91 20 93 33
                                    C103 36 105 50 98 57
                                    C105 68 99 80 89 82
                                    C89 96 76 103 65 95
                                    Z
                                "
                            />


                            <!-- center split -->

                            <path
                                class="brain-center"
                                d="
                                    M60 25
                                    V96
                                "
                            />


                            <!-- internal neural lines -->

                            <path
                                class="brain-neural"
                                d="
                                    M36 39
                                    C45 42 47 48 44 57
                                    C40 67 47 74 53 77
                                "
                            />

                            <path
                                class="brain-neural"
                                d="
                                    M84 39
                                    C75 42 73 48 76 57
                                    C80 67 73 74 67 77
                                "
                            />


                            <!-- neural points -->

                            <circle
                                class="brain-node-dot"
                                cx="37"
                                cy="39"
                                r="3"
                            />

                            <circle
                                class="brain-node-dot"
                                cx="83"
                                cy="39"
                                r="3"
                            />

                            <circle
                                class="brain-node-dot"
                                cx="48"
                                cy="76"
                                r="3"
                            />

                            <circle
                                class="brain-node-dot"
                                cx="72"
                                cy="76"
                                r="3"
                            />


                        </svg>


                    </div>



                    <!-- pulse ring -->

                    <div class="core-pulse"></div>


                </div>




                <!-- =================================================
                     SMART CLUB BACK IDENTITY
                ================================================== -->

                <div class="back-brand">


                    <span class="brand-line"></span>


                    <div class="brand-symbol">


                        <svg
                            viewBox="0 0 40 40"
                            aria-hidden="true"
                        >

                            <circle
                                cx="20"
                                cy="20"
                                r="14"
                            />

                            <path
                                d="
                                    M12 20
                                    L17 25
                                    L28 14
                                "
                            />

                        </svg>


                    </div>


                    <span class="brand-name">
                        SMART CLUB
                    </span>


                    <span class="brand-line"></span>


                </div>



                <!-- sweeping back reflection -->

                <div class="back-light-runner"></div>


            </article>




            <!-- =================================================
                 PRESIDENT CARD FRONT
            ================================================== -->

            <article class="card-side card-front">


                <!-- =================================================
                     BASE CARD MATERIAL
                ================================================== -->

                <div class="front-shell"></div>

                <div class="front-light-layer"></div>

                <div class="front-holographic-layer"></div>

                <div class="front-grid"></div>



                <!-- =================================================
                     MICRO TEXTURE
                ================================================== -->

                <div class="card-noise"></div>



                <!-- =================================================
                     PREMIUM OUTER FRAME
                ================================================== -->

                <div class="premium-frame">


                    <div class="frame-top"></div>

                    <div class="frame-right"></div>

                    <div class="frame-bottom"></div>

                    <div class="frame-left"></div>


                </div>



                <div class="inner-premium-frame"></div>




                <!-- =================================================
                     TOP STRUCTURAL PLATES
                ================================================== -->

                <div class="top-armor">


                    <span class="top-armor-left"></span>

                    <span class="top-armor-center"></span>

                    <span class="top-armor-right"></span>


                </div>




                <!-- =================================================
                     LIGHT RAILS
                ================================================== -->

                <div class="light-rail light-rail-left">

                    <span></span>

                </div>


                <div class="light-rail light-rail-right">

                    <span></span>

                </div>




                <!-- =================================================
                     PRESIDENT HEADER
                ================================================== -->

                <header class="president-header">


                    <!-- left wing -->

                    <div class="header-wing header-wing-left">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>



                    <!-- =================================================
                         PRESIDENT CROWN EMBLEM
                    ================================================== -->

                    <div class="president-emblem">


                        <div class="emblem-glow"></div>


                        <div class="emblem-ring emblem-ring-one"></div>

                        <div class="emblem-ring emblem-ring-two"></div>



                        <div class="crown-container">


                            <svg
                                class="crown-icon"
                                viewBox="0 0 120 90"
                                xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true"
                            >


                                <!-- crown body -->

                                <path
                                    class="crown-main"
                                    d="
                                        M15 67
                                        L24 25
                                        L47 50
                                        L60 14
                                        L73 50
                                        L96 25
                                        L105 67
                                        Z
                                    "
                                />


                                <!-- crown base -->

                                <path
                                    class="crown-base"
                                    d="
                                        M18 73
                                        H102
                                    "
                                />


                                <!-- crown jewels -->

                                <circle
                                    class="crown-jewel"
                                    cx="24"
                                    cy="25"
                                    r="3"
                                />

                                <circle
                                    class="crown-jewel crown-jewel-center"
                                    cx="60"
                                    cy="14"
                                    r="4"
                                />

                                <circle
                                    class="crown-jewel"
                                    cx="96"
                                    cy="25"
                                    r="3"
                                />


                            </svg>


                        </div>


                    </div>



                    <!-- right wing -->

                    <div class="header-wing header-wing-right">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                </header>




                <!-- =================================================
                     PRESIDENT TITLE
                ================================================== -->

                <div class="president-title">


                    <span class="title-dot"></span>


                    <span class="title-line title-line-left"></span>


                    <span class="title-text">

                        PRESIDENT

                    </span>


                    <span class="title-line title-line-right"></span>


                    <span class="title-dot"></span>


                </div>




                <!-- =================================================
                     LEADERSHIP HALO
                ================================================== -->

                <div class="leadership-halo">


                    <div class="leadership-halo-ring halo-ring-outer"></div>

                    <div class="leadership-halo-ring halo-ring-inner"></div>


                    <span class="halo-marker halo-marker-1"></span>

                    <span class="halo-marker halo-marker-2"></span>

                    <span class="halo-marker halo-marker-3"></span>

                    <span class="halo-marker halo-marker-4"></span>


                </div>




                <!-- =================================================
                     ENERGY BEHIND PRESIDENT
                ================================================== -->

                <div class="portrait-energy">


                    <div class="portrait-ring portrait-ring-one"></div>

                    <div class="portrait-ring portrait-ring-two"></div>


                    <div class="portrait-rays">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div class="portrait-core-light"></div>


                </div>




                <!-- =================================================
                     LEFT SMART NODE
                     CUSTOM BRAIN SVG
                ================================================== -->

                <div class="brain-node brain-node-left">


                    <div class="node-frame"></div>


                    <div class="brain-node-core">


                        <svg
                            class="node-icon node-brain-icon"
                            viewBox="0 0 100 100"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >


                            <path
                                d="
                                    M46 22
                                    C35 14 23 21 24 32
                                    C13 36 15 50 23 54
                                    C16 65 23 76 33 76
                                    C34 89 46 91 50 83
                                    V28
                                    C49 25 48 23 46 22
                                    Z
                                "
                            />


                            <path
                                d="
                                    M54 22
                                    C65 14 77 21 76 32
                                    C87 36 85 50 77 54
                                    C84 65 77 76 67 76
                                    C66 89 54 91 50 83
                                    V28
                                    C51 25 52 23 54 22
                                    Z
                                "
                            />


                            <path
                                class="node-detail"
                                d="
                                    M31 39
                                    C40 40 43 47 40 55
                                    M69 39
                                    C60 40 57 47 60 55
                                "
                            />


                        </svg>


                    </div>


                    <div class="node-pulse"></div>


                </div>




                <!-- =================================================
                     RIGHT ENERGY NODE
                     CUSTOM LIGHTNING SVG
                ================================================== -->

                <div class="brain-node brain-node-right">


                    <div class="node-frame"></div>


                    <div class="brain-node-core">


                        <svg
                            class="node-icon node-bolt-icon"
                            viewBox="0 0 100 100"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >


                            <path
                                d="
                                    M57 10
                                    L27 55
                                    H46
                                    L40 90
                                    L74 42
                                    H54
                                    Z
                                "
                            />


                        </svg>


                    </div>


                    <div class="node-pulse"></div>


                </div>




                <!-- =================================================
                     PORTRAIT FRAME
                ================================================== -->

                <div class="portrait-frame">


                    <!-- upper structural plate -->

                    <div class="portrait-top-frame"></div>


                    <!-- frame accents -->

                    <div
                        class="portrait-side-accent accent-left"
                    ></div>


                    <div
                        class="portrait-side-accent accent-right"
                    ></div>



                    <!-- =================================================
                         PRESIDENT PHOTO
                    ================================================== -->

                    <div class="member-image-container">


                        <img
                            src="president.png"
                            alt="Smart Club President"
                            class="member-image"
                            id="memberImage"
                        >


                    </div>



                    <!-- Backlighting -->

                    <div class="portrait-backlight"></div>


                    <!-- Front ground light -->

                    <div class="portrait-front-glow"></div>


                    <!-- soft portrait vignette -->

                    <div class="portrait-vignette"></div>


                </div>




                <!-- =================================================
                     LEADERSHIP SIDE ORNAMENTS
                ================================================== -->

                <div class="leadership-ornament ornament-left">


                    <span></span>
                    <span></span>
                    <span></span>


                </div>


                <div class="leadership-ornament ornament-right">


                    <span></span>
                    <span></span>
                    <span></span>


                </div>




                <!-- =================================================
                     ELECTRIC FRAME DETAILS
                ================================================== -->

                <div class="electric-zone electric-left">

                    <span class="electric-line e1"></span>

                    <span class="electric-line e2"></span>

                    <span class="electric-line e3"></span>

                </div>


                <div class="electric-zone electric-right">

                    <span class="electric-line e1"></span>

                    <span class="electric-line e2"></span>

                    <span class="electric-line e3"></span>

                </div>




                <!-- =================================================
                     SCANNER
                ================================================== -->

                <div class="scan-system">


                    <div class="scan-line"></div>

                    <div class="scan-light"></div>


                </div>




                <!-- =================================================
                     IDENTITY PANEL
                ================================================== -->

                <footer class="identity">


                    <!-- upper ornament -->

                    <div class="identity-decoration">


                        <span></span>


                        <div class="identity-diamond"></div>


                        <span></span>


                    </div>



                    <!-- =================================================
                         MEMBER NAME
                    ================================================== -->

                    <h1 class="member-name">

                        AMINA EL-BERDAOUI

                    </h1>



                    <!-- =================================================
                         ROLE
                    ================================================== -->

                    <div class="role-container">


                        <span class="role-line"></span>


                        <p class="member-role">

                            PRESIDENT

                        </p>


                        <span class="role-line"></span>


                    </div>


                </footer>




                <!-- =================================================
                     FOUR PREMIUM CORNERS
                ================================================== -->

                <div class="premium-corner corner-top-left">

                    <span></span>

                </div>


                <div class="premium-corner corner-top-right">

                    <span></span>

                </div>


                <div class="premium-corner corner-bottom-left">

                    <span></span>

                </div>


                <div class="premium-corner corner-bottom-right">

                    <span></span>

                </div>




                <!-- =================================================
                     MOVING BORDER LIGHT
                ================================================== -->

                <div class="moving-border-light"></div>




                <!-- =================================================
                     REFLECTIVE SHINE
                ================================================== -->

                <div
                    class="card-shine"
                    id="cardShine"
                ></div>




                <!-- =================================================
                     GLASS REFLECTION
                ================================================== -->

                <div class="glass-reflection"></div>


            </article>


        </div>


    </div>


</main>




<!-- =========================================================
     CINEMATIC REVEAL FLASH
========================================================= -->

<div
    class="flash"
    id="flash"
></div>




<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="script.js"></script>


</body>

</html>
