<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Club — Media
    </title>

    <link
        rel="stylesheet"
        href="media.css"
    >

</head>


<body>


<!-- =========================================================
     MAIN CINEMATIC SCENE
========================================================= -->

<main
    class="scene"
    id="scene"
>


    <!-- =====================================================
         BACKGROUND ENVIRONMENT
    ====================================================== -->

    <div class="scene-light scene-light-left"></div>

    <div class="scene-light scene-light-right"></div>

    <div class="scene-light scene-light-center"></div>


    <div class="background-grid"></div>


    <div
        class="particles"
        id="particles"
    ></div>


    <!-- distant circular structures -->

    <div class="background-energy-ring ring-one"></div>

    <div class="background-energy-ring ring-two"></div>


    <div class="scene-orbit scene-orbit-large"></div>

    <div class="scene-orbit scene-orbit-small"></div>



    <!-- =====================================================
         CARD STAGE
    ====================================================== -->

    <div class="card-stage">


        <div class="card-shadow"></div>

        <div class="stage-aura"></div>



        <!-- =================================================
             CARD WRAPPER
        ================================================== -->

        <div
            class="card-wrapper"
            id="card"
        >


            <!-- =================================================
                 CARD BACK
            ================================================== -->

            <article class="card-side card-back">


                <div class="back-shell"></div>

                <div class="back-metal-frame"></div>

                <div class="back-inner-frame"></div>

                <div class="back-hologram"></div>



                <!-- BACK STRUCTURE -->

                <div class="back-top-plate"></div>

                <div class="back-bottom-plate"></div>

                <div class="back-side-plate back-side-left"></div>

                <div class="back-side-plate back-side-right"></div>



                <!-- CIRCUITS -->

                <div class="circuit circuit-top-left"></div>

                <div class="circuit circuit-top-right"></div>

                <div class="circuit circuit-bottom-left"></div>

                <div class="circuit circuit-bottom-right"></div>



                <!-- ENERGY CORNERS -->

                <div class="energy-corner back-corner-1"></div>

                <div class="energy-corner back-corner-2"></div>

                <div class="energy-corner back-corner-3"></div>

                <div class="energy-corner back-corner-4"></div>



                <!-- =================================================
                     SMART CLUB CORE
                ================================================== -->

                <div class="back-core">


                    <div class="core-orbit orbit-large">

                        <span class="orbit-marker marker-a"></span>

                        <span class="orbit-marker marker-b"></span>

                    </div>


                    <div class="core-orbit orbit-medium">

                        <span class="orbit-marker marker-c"></span>

                    </div>


                    <div class="core-orbit orbit-small"></div>



                    <!-- SMART BRAIN -->

                    <div class="brain-emblem">


                        <div class="brain-emblem-ring"></div>


                        <svg
                            class="brain-icon"
                            viewBox="0 0 120 120"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >


                            <path
                                class="brain-path brain-left"
                                d="
                                    M55 24
                                    C44 15 29 20 27 33
                                    C17 36 15 50 22 57
                                    C15 68 21 80 31 82
                                    C31 96 44 103 55 95
                                    Z
                                "
                            />


                            <path
                                class="brain-path brain-right"
                                d="
                                    M65 24
                                    C76 15 91 20 93 33
                                    C103 36 105 50 98 57
                                    C105 68 99 80 89 82
                                    C89 96 76 103 65 95
                                    Z
                                "
                            />


                            <path
                                class="brain-center"
                                d="
                                    M60 25
                                    V96
                                "
                            />


                            <path
                                class="brain-neural"
                                d="
                                    M36 39
                                    C45 42 47 48 44 57
                                    C40 67 47 74 53 77
                                "
                            />


                            <path
                                class="brain-neural"
                                d="
                                    M84 39
                                    C75 42 73 48 76 57
                                    C80 67 73 74 67 77
                                "
                            />


                            <circle
                                class="brain-node-dot"
                                cx="37"
                                cy="39"
                                r="3"
                            />

                            <circle
                                class="brain-node-dot"
                                cx="83"
                                cy="39"
                                r="3"
                            />

                            <circle
                                class="brain-node-dot"
                                cx="48"
                                cy="76"
                                r="3"
                            />

                            <circle
                                class="brain-node-dot"
                                cx="72"
                                cy="76"
                                r="3"
                            />


                        </svg>


                    </div>


                    <div class="core-pulse"></div>


                </div>



                <!-- =================================================
                     SMART CLUB BACK IDENTITY
                ================================================== -->

                <div class="back-brand">


                    <span class="brand-line"></span>


                    <div class="brand-symbol">


                        <svg
                            viewBox="0 0 40 40"
                            aria-hidden="true"
                        >

                            <circle
                                cx="20"
                                cy="20"
                                r="14"
                            />

                            <path
                                d="
                                    M12 20
                                    L17 25
                                    L28 14
                                "
                            />

                        </svg>


                    </div>


                    <span class="brand-name">
                        SMART CLUB
                    </span>


                    <span class="brand-line"></span>


                </div>


                <div class="back-light-runner"></div>


            </article>



            <!-- =================================================
                 MEDIA CARD FRONT
            ================================================== -->

            <article class="card-side card-front">


                <!-- BASE -->

                <div class="front-shell"></div>

                <div class="front-light-layer"></div>

                <div class="front-holographic-layer"></div>

                <div class="front-grid"></div>

                <div class="card-noise"></div>



                <!-- =================================================
                     PREMIUM FRAME
                ================================================== -->

                <div class="premium-frame">

                    <div class="frame-top"></div>

                    <div class="frame-right"></div>

                    <div class="frame-bottom"></div>

                    <div class="frame-left"></div>

                </div>


                <div class="inner-premium-frame"></div>



                <!-- TOP ARMOR -->

                <div class="top-armor">

                    <span class="top-armor-left"></span>

                    <span class="top-armor-center"></span>

                    <span class="top-armor-right"></span>

                </div>



                <!-- LIGHT RAILS -->

                <div class="light-rail light-rail-left">

                    <span></span>

                </div>


                <div class="light-rail light-rail-right">

                    <span></span>

                </div>



                <!-- =================================================
                     MEDIA HEADER
                ================================================== -->

                <header class="president-header media-header">


                    <!-- LEFT WING -->

                    <div class="header-wing header-wing-left">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>



                    <!-- =================================================
                         MEDIA CAMERA EMBLEM

                         We preserve some President classes so our
                         existing animation system remains compatible.
                    ================================================== -->

                    <div class="president-emblem media-emblem">


                        <div class="emblem-glow"></div>


                        <div class="emblem-ring emblem-ring-one"></div>

                        <div class="emblem-ring emblem-ring-two"></div>



                        <div class="crown-container camera-container">


                            <!-- =========================================
                                 CUSTOM CAMERA SVG
                            ========================================== -->

                            <svg
                                class="crown-icon camera-icon"
                                viewBox="0 0 120 90"
                                xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true"
                            >


                                <!-- CAMERA TOP -->

                                <path
                                    class="camera-top"
                                    d="
                                        M42 29
                                        L50 17
                                        H70
                                        L78 29
                                        Z
                                    "
                                />


                                <!-- CAMERA BODY -->

                                <path
                                    class="camera-body"
                                    d="
                                        M26 29

                                        H94

                                        C101 29
                                        106 34
                                        106 41

                                        V68

                                        C106 77
                                        101 82
                                        93 82

                                        H27

                                        C19 82
                                        14 77
                                        14 68

                                        V42

                                        C14 34
                                        19 29
                                        26 29

                                        Z
                                    "
                                />


                                <!-- LENS OUTER -->

                                <circle
                                    class="camera-lens-outer"
                                    cx="60"
                                    cy="56"
                                    r="17"
                                />


                                <!-- LENS MIDDLE -->

                                <circle
                                    class="camera-lens-middle"
                                    cx="60"
                                    cy="56"
                                    r="12"
                                />


                                <!-- LENS INNER -->

                                <circle
                                    class="camera-lens-inner"
                                    cx="60"
                                    cy="56"
                                    r="7"
                                />


                                <!-- LENS REFLECTION -->

                                <circle
                                    class="camera-lens-reflection"
                                    cx="56"
                                    cy="52"
                                    r="2.3"
                                />


                            </svg>



                            <!--
                                EXTRA ELEMENT FOR THE MEDIA JS.

                                Later this can rotate/focus independently
                                from the actual SVG.
                            -->

                            <div class="camera-focus-ring"></div>


                            <!-- Camera flash point -->

                            <div class="camera-flash-point"></div>


                        </div>


                    </div>



                    <!-- RIGHT WING -->

                    <div class="header-wing header-wing-right">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                </header>



                <!-- =================================================
                     MEDIA TITLE
                ================================================== -->

                <div class="president-title media-title">


                    <span class="title-dot"></span>


                    <span class="title-line title-line-left"></span>


                    <span class="title-text">

                        MEDIA

                    </span>


                    <span class="title-line title-line-right"></span>


                    <span class="title-dot"></span>


                </div>



                <!-- =================================================
                     MEMBER HALO
                ================================================== -->

                <div class="leadership-halo media-halo">


                    <div class="leadership-halo-ring halo-ring-outer"></div>

                    <div class="leadership-halo-ring halo-ring-inner"></div>


                    <span class="halo-marker halo-marker-1"></span>

                    <span class="halo-marker halo-marker-2"></span>

                    <span class="halo-marker halo-marker-3"></span>

                    <span class="halo-marker halo-marker-4"></span>


                </div>



                <!-- =================================================
                     ENERGY BEHIND MEMBER
                ================================================== -->

                <div class="portrait-energy">


                    <div class="portrait-ring portrait-ring-one"></div>

                    <div class="portrait-ring portrait-ring-two"></div>


                    <div class="portrait-rays">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div class="portrait-core-light"></div>


                </div>



                <!-- =================================================
                     LEFT SMART NODE
                ================================================== -->

<!-- =================================================
     LEFT MEDIA NODE — VIDEO / CONTENT
================================================== -->

<div class="brain-node brain-node-left">

    <div class="node-frame"></div>

    <div class="brain-node-core">

        <svg
            class="node-icon media-video-icon"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >

            <!-- VIDEO SCREEN -->
            <rect
                x="19"
                y="27"
                width="62"
                height="46"
                rx="8"
                fill="none"
                stroke="currentColor"
                stroke-width="4"
            />

            <!-- PLAY SYMBOL -->
            <path
                d="
                    M43 39
                    L65 50
                    L43 61
                    Z
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linejoin="round"
            />

            <!-- SMALL RECORD DOT -->
            <circle
                cx="72"
                cy="35"
                r="3"
                fill="currentColor"
                stroke="none"
            />

        </svg>

    </div>

    <div class="node-pulse"></div>

</div>



<!-- =================================================
     RIGHT MEDIA NODE — BROADCAST / SIGNAL
================================================== -->

<div class="brain-node brain-node-right">

    <div class="node-frame"></div>

    <div class="brain-node-core">

        <svg
            class="node-icon media-signal-icon"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >

            <!-- CENTER TRANSMITTER -->
            <circle
                cx="50"
                cy="50"
                r="6"
                fill="currentColor"
                stroke="none"
            />

            <!-- INNER SIGNAL LEFT -->
            <path
                d="
                    M39 39
                    C31 45 31 55 39 61
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />

            <!-- INNER SIGNAL RIGHT -->
            <path
                d="
                    M61 39
                    C69 45 69 55 61 61
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />

            <!-- OUTER SIGNAL LEFT -->
            <path
                d="
                    M29 29
                    C15 41 15 59 29 71
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />

            <!-- OUTER SIGNAL RIGHT -->
            <path
                d="
                    M71 29
                    C85 41 85 59 71 71
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />

            <!-- ANTENNA -->
            <path
                d="
                    M50 56
                    L50 76
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
            />

        </svg>

    </div>

    <div class="node-pulse"></div>

</div>


                <!-- =================================================
                     PORTRAIT
                ================================================== -->

                <div class="portrait-frame">


                    <div class="portrait-top-frame"></div>


                    <div
                        class="portrait-side-accent accent-left"
                    ></div>


                    <div
                        class="portrait-side-accent accent-right"
                    ></div>



                    <!-- =================================================
                         MEDIA MEMBER PHOTO

                         Put your transparent PNG in the same folder
                         and name it:

                         media.png
                    ================================================== -->

                    <div class="member-image-container">


                        <img
                            src="media1.png"
                            alt="Smart Club Media Member"
                            class="member-image"
                            id="memberImage"
                        >


                    </div>



                    <div class="portrait-backlight"></div>

                    <div class="portrait-front-glow"></div>

                    <div class="portrait-vignette"></div>


                </div>



                <!-- =================================================
                     SIDE ORNAMENTS
                ================================================== -->

                <div class="leadership-ornament ornament-left">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="leadership-ornament ornament-right">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>



                <!-- =================================================
                     ELECTRIC DETAILS
                ================================================== -->

                <div class="electric-zone electric-left">

                    <span class="electric-line e1"></span>

                    <span class="electric-line e2"></span>

                    <span class="electric-line e3"></span>

                </div>


                <div class="electric-zone electric-right">

                    <span class="electric-line e1"></span>

                    <span class="electric-line e2"></span>

                    <span class="electric-line e3"></span>

                </div>



                <!-- =================================================
                     SCANNER
                ================================================== -->

                <div class="scan-system">

                    <div class="scan-line"></div>

                    <div class="scan-light"></div>

                </div>



                <!-- =================================================
                     MEDIA MEMBER IDENTITY
                ================================================== -->

                <footer class="identity">


                    <div class="identity-decoration">


                        <span></span>


                        <div class="identity-diamond"></div>


                        <span></span>


                    </div>



                    <!-- CHANGE MEMBER NAME HERE -->

                    <h1 class="member-name">

                        Taha El Malki Ammi


                    </h1>



                    <div class="role-container">


                        <span class="role-line"></span>


                        <p class="member-role">

                            MEDIA

                        </p>


                        <span class="role-line"></span>


                    </div>


                </footer>



                <!-- =================================================
                     PREMIUM CORNERS
                ================================================== -->

                <div class="premium-corner corner-top-left">

                    <span></span>

                </div>


                <div class="premium-corner corner-top-right">

                    <span></span>

                </div>


                <div class="premium-corner corner-bottom-left">

                    <span></span>

                </div>


                <div class="premium-corner corner-bottom-right">

                    <span></span>

                </div>



                <!-- MOVING BORDER -->

                <div class="moving-border-light"></div>



                <!-- REFLECTIVE SHINE -->

                <div
                    class="card-shine"
                    id="cardShine"
                ></div>



                <!-- GLASS REFLECTION -->

                <div class="glass-reflection"></div>


            </article>


        </div>


    </div>


</main>



<!-- =========================================================
     CAMERA FLASH OVERLAY

     This is separate from the normal reveal flash.
     We'll use it in the Media JS for a quick camera shutter flash.
========================================================= -->

<div
    class="media-camera-flash"
    id="mediaCameraFlash"
></div>



<!-- =========================================================
     CINEMATIC REVEAL FLASH
========================================================= -->

<div
    class="flash"
    id="flash"
></div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="media.js"></script>


</body>

</html>
